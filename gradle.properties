groupId=io.fastpix
artifactId=sdk
version=1.0.4
springBootVersion=3.2.0
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g

mavenCentralPublishing=true
signAllPublications=true

# Maven Central Publishing Credentials & GPG Signing
# ---------------------------------------------------
# Secrets are NOT stored in this tracked file. Provide them at build time via
# either of the following (the vanniktech maven-publish plugin reads them the
# same way, so the publish flow is unchanged):
#
#   1. Environment variables (used by CI):
#        ORG_GRADLE_PROJECT_mavenCentralUsername
#        ORG_GRADLE_PROJECT_mavenCentralPassword
#        ORG_GRADLE_PROJECT_signingInMemoryKey / ORG_GRADLE_PROJECT_signingKey
#        ORG_GRADLE_PROJECT_signingInMemoryKeyPassword / ORG_GRADLE_PROJECT_signingPassphrase
#
#   2. A local, untracked ~/.gradle/gradle.properties:
#        mavenCentralUsername=...
#        mavenCentralPassword=...
#        signing.keyId=...
#        signing.password=...
#
# Note: useGpgCmd() reads the key material from ~/.gnupg/, so no keyring file
# path is needed here (signing.secretKeyRingFile intentionally left unset).
