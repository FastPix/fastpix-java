// This file
// * is referred to in an `apply from` command in `build.gradle`
// * can be used to customise `build.gradle`

// Fix deprecated Gradle features for Gradle 9.0 compatibility
// Override deprecated direct task property access (compileJava.options, compileTestJava.options)
tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    // The SDK supports Java 11, but the build itself runs on a newer JDK so the
    // Spring Boot 3.2 subprojects can compile. `release` makes javac reject any
    // API added after Java 11, which -source/-target alone do not catch.
    options.release = 11
    if (!name.contains("Test")) {
        options.compilerArgs += '-Xlint:unchecked'
    }
}

// Override deprecated archiveBaseName property assignment
// Use base.archivesName instead (applies to sourcesJar, javadocJar, and main jar)
base {
    archivesName = "${artifactId}"
}

// Ensure javadoc encoding is properly configured
tasks.withType(Javadoc).configureEach {
    options.encoding = "UTF-8"
}

tasks.withType(GenerateModuleMetadata).configureEach {
    enabled = false
}

// Prints the main source set's runtime classpath (SDK classes + dependency jars)
// on a single line. Consumed by tests/ (the TypeScript endpoint validators) to
// compile and run the hand-written Java SDK harness against the built SDK.
// Usage: ./gradlew -q printRuntimeClasspath
tasks.register("printRuntimeClasspath") {
    dependsOn("compileJava")
    doLast {
        println sourceSets.main.runtimeClasspath.asPath
    }
}



tasks.register("emptyJavadocJar", Jar) {
    archiveClassifier.set("javadoc")
    from(layout.buildDirectory.dir("empty-javadoc")) {
        into("/")
    }

    doFirst {
        def dir = layout.buildDirectory.dir("empty-javadoc").get().asFile
        dir.mkdirs()
        def index = new File(dir, "index.html")
        if (!index.exists()) {
            index.text = "<html><body><h1>FastPix Java SDK</h1></body></html>"
        }
    }
}

afterEvaluate {
    publishing {
        publications.withType(MavenPublication).configureEach {
            artifact(tasks.named("emptyJavadocJar"))
        }
    }
}


// Bundle the Apache 2.0 license text into every published jar (jar, sources,
// javadoc) so the license travels with the artifact, per Apache 2.0 §4(a).
tasks.withType(Jar).configureEach {
    from(rootProject.file("LICENSE")) {
        into("META-INF")
    }
}
