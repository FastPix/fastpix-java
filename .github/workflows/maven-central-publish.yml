name: Publish to Maven Central

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: 'gradle'

      - name: Import GPG key
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Build and publish to local Maven repo
        env:
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingPassphrase: ${{ secrets.GPG_PASSPHRASE }}
        run: ./gradlew clean build publishToMavenLocal

      - name: Resolve published version
        run: |
          VERSION="$(./gradlew -q --no-daemon properties | awk -F': ' '/^version: /{print $2}')"
          echo "Resolved version: $VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: List build outputs
        run: |
          find build -type f
          find ~/.m2/repository/io/fastpix/sdk/"$VERSION" -type f || true

      - name: Prepare artifacts for upload
        run: |
          mkdir -p upload
          cp ~/.m2/repository/io/fastpix/sdk/"$VERSION"/sdk-"$VERSION".jar upload/
          cp ~/.m2/repository/io/fastpix/sdk/"$VERSION"/sdk-"$VERSION".pom upload/
          cp ~/.m2/repository/io/fastpix/sdk/"$VERSION"/sdk-"$VERSION"-sources.jar upload/ || true
          cp ~/.m2/repository/io/fastpix/sdk/"$VERSION"/sdk-"$VERSION"-javadoc.jar upload/ || true

      - name: Upload to Central Publishing Portal
        env:
          CPP_USER_TOKEN_USERNAME: ${{ secrets.CPP_USER_TOKEN_USERNAME }}
          CPP_USER_TOKEN_PASSWORD: ${{ secrets.CPP_USER_TOKEN_PASSWORD }}
        run: |
          curl -u "$CPP_USER_TOKEN_USERNAME:$CPP_USER_TOKEN_PASSWORD" \
            -F "file=@upload/sdk-$VERSION.jar" \
            -F "file=@upload/sdk-$VERSION.pom" \
            -F "file=@upload/sdk-$VERSION-sources.jar" \
            -F "file=@upload/sdk-$VERSION-javadoc.jar" \
            https://central.sonatype.com/api/v1/publish
