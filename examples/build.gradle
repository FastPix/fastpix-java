plugins {
    id 'java'
}

group = 'com.fastpix'
version = '1.1.0'

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

repositories {
    mavenLocal()  // the SDK is resolved from your local Maven repo
    mavenCentral()
}

dependencies {
    // jackson-databind arrives transitively at compile scope from the SDK,
    // which exposes ObjectMapper and JsonNode in its public API.
    implementation 'io.fastpix:sdk:1.1.0'
    runtimeOnly 'org.slf4j:slf4j-simple:2.0.9'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

// One `run<ExampleName>` task per example class, e.g. `./gradlew runDirectUpload`.
// Each reads FASTPIX_* from the environment it inherits.
fileTree("src/main/java/com/fastpix/example").matching { include "*Example.java" }.each { f ->
    def name = f.name - ".java"
    tasks.register("run${name - 'Example'}", JavaExec) {
        group = "examples"
        description = "Run ${name}"
        classpath = sourceSets.main.runtimeClasspath
        mainClass = "com.fastpix.example.${name}"
    }
}
