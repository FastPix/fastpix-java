trigger:
- main
- feature/*

pr:
- main
- feature/*

resources:
- repo: self

variables:
  vmImageName: 'ubuntu-latest'

stages:
- stage: SonarCloudAnalysis
  displayName: SonarCloud Analysis Stage

  jobs:
  - job: Analyze
    displayName: Run SonarCloud Analysis

    pool:
      vmImage: $(vmImageName)

    steps:
    - checkout: self
      fetchDepth: 0

    # SonarCloud's Java sensor needs JDK 17+ to run, and the SDK targets Java 11.
    - task: JavaToolInstaller@0
      displayName: 'Use JDK 17'
      inputs:
        versionSpec: '17'
        jdkArchitectureOption: 'x64'
        jdkSourceOption: 'PreInstalled'

    # The Java sensor analyses COMPILED bytecode, not source. Without this the
    # scanner finds no .class files and reports zero issues for every .java file.
    # We compile the SDK and resolve the dependency classpath so Sonar can wire up
    # sonar.java.binaries (our classes) and sonar.java.libraries (dependency jars).
    - script: |
        set -e
        chmod +x ./gradlew
        ./gradlew --no-daemon clean compileJava
        # Build a comma-separated classpath for sonar.java.libraries, keeping only
        # entries that actually exist on disk. SonarJava rejects the whole property
        # if any path is missing (e.g. build/resources/main is never created when
        # there are no main resources), so unresolved entries must be filtered out.
        RAW_CP="$(./gradlew -q --no-daemon printRuntimeClasspath | tail -n1)"
        SONAR_LIBS=""
        IFS=':'
        for entry in $RAW_CP; do
          [ -e "$entry" ] || continue
          if [ -z "$SONAR_LIBS" ]; then SONAR_LIBS="$entry"; else SONAR_LIBS="$SONAR_LIBS,$entry"; fi
        done
        unset IFS
        echo "Resolved Sonar Java libraries: $SONAR_LIBS"
        echo "##vso[task.setvariable variable=sonarJavaLibraries]$SONAR_LIBS"
      displayName: 'Compile SDK and resolve classpath'

    - task: SonarCloudPrepare@3
      displayName: 'Prepare SonarCloud Analysis'
      inputs:
        SonarCloud: 'sdk_sonar'
        organization: 'fastpix'
        scannerMode: 'CLI'
        configMode: 'manual'
        cliProjectKey: 'FastPix_java-language-sdk-server-side'
        cliProjectName: 'java-language-sdk-server-side'
        extraProperties: |
          sonar.projectKey=FastPix_java-language-sdk-server-side
          sonar.organization=fastpix
          sonar.projectName=java-language-sdk-server-side
          sonar.sourceEncoding=UTF-8
          sonar.sources=src/main/java
          sonar.java.source=11
          sonar.java.binaries=build/classes/java/main
          sonar.java.libraries=$(sonarJavaLibraries)

    - task: SonarCloudAnalyze@3
      displayName: 'Run SonarCloud Code Analysis'

    - task: SonarCloudPublish@3
      displayName: 'Publish SonarCloud Quality Gate Results'
      inputs:
        pollingTimeoutSec: '300'
